<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symbolic Calculus & Curve Sketching Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #1a365d; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; margin-top: 0; }
        .controls { display: flex; gap: 10px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
        input { padding: 10px 15px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 6px; width: 300px; }
        button { padding: 10px 20px; font-size: 16px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .presets { text-align: center; margin-bottom: 20px; }
        .presets button { background: #e2e8f0; color: #1e293b; font-size: 13px; padding: 6px 12px; margin: 3px; }
        .analysis-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: #f8fafc; padding: 15px; border-left: 4px solid #2563eb; border-radius: 6px; }
        .card h3 { margin: 0 0 8px 0; font-size: 14px; color: #475569; }
        .card p { margin: 0; font-size: 16px; font-weight: bold; color: #0f172a; word-break: break-all; }
        #plot { width: 100%; height: 480px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Symbolic Calculus & Curve Sketching Engine</h1>
    <p class="subtitle">Real-Time Derivative Analysis & Educational Visualization</p>

    <div class="controls">
        <input type="text" id="funcInput" value="x^3 - 3*x" placeholder="Enter f(x), e.g., x^3 - 3*x">
        <button onclick="analyzeAndPlot()">Analyze & Sketch</button>
    </div>

    <div class="presets">
        <span>Try Examples: </span>
        <button onclick="setPreset('x^3 - 3*x')">x³ - 3x</button>
        <button onclick="setPreset('sin(x) * exp(-0.2*x)')">Damped Sine</button>
        <button onclick="setPreset('x^4 - 4*x^2 + 2')">x⁴ - 4x² + 2</button>
        <button onclick="setPreset('1 / (1 + x^2)')">Bell Curve</button>
    </div>

    <div class="analysis-box">
        <div class="card">
            <h3>Function f(x)</h3>
            <p id="disp-f">-</p>
        </div>
        <div class="card" style="border-color: #16a34a;">
            <h3>First Derivative f'(x)</h3>
            <p id="disp-df">-</p>
        </div>
        <div class="card" style="border-color: #dc2626;">
            <h3>Second Derivative f''(x)</h3>
            <p id="disp-ddf">-</p>
        </div>
        <div class="card" style="border-color: #9333ea;">
            <h3>Approx. Critical Points (f'(x) ≈ 0)</h3>
            <p id="disp-crit">-</p>
        </div>
    </div>

    <div id="plot"></div>
</div>

<script>
    function setPreset(expr) {
        document.getElementById('funcInput').value = expr;
        analyzeAndPlot();
    }

    function analyzeAndPlot() {
        const exprStr = document.getElementById('funcInput').value;
        try {
            const f = math.parse(exprStr);
            const df = math.derivative(f, 'x');
            const ddf = math.derivative(df, 'x');

            document.getElementById('disp-f').innerText = f.toString();
            document.getElementById('disp-df').innerText = df.toString();
            document.getElementById('disp-ddf').innerText = ddf.toString();

            const fCompiled = f.compile();
            const dfCompiled = df.compile();
            const ddfCompiled = ddf.compile();

            let xVals = [], yVals = [], dyVals = [], ddyVals = [];
            let critX = [], critY = [], critLabels = [];

            for (let x = -10; x <= 10; x += 0.05) {
                x = Math.round(x * 100) / 100;
                let y = fCompiled.evaluate({x: x});
                let dy = dfCompiled.evaluate({x: x});
                let ddy = ddfCompiled.evaluate({x: x});

                xVals.push(x);
                yVals.push(Math.abs(y) < 100 ? y : null);
                dyVals.push(Math.abs(dy) < 100 ? dy : null);
                ddyVals.push(Math.abs(ddy) < 100 ? ddy : null);

                // Detect sign change in f'(x) for critical points
                if (x > -10) {
                    let prevDy = dyVals[dyVals.length - 2];
                    if (prevDy !== null && dy !== null && prevDy * dy <= 0 && Math.abs(y) < 100) {
                        critX.push(x);
                        critY.push(y);
                        critLabels.push(`(${x}, ${y.toFixed(2)})`);
                    }
                }
            }

            document.getElementById('disp-crit').innerText = critLabels.length > 0 ? critLabels.join(', ') : 'None in [-10, 10]';

            const traceF = { x: xVals, y: yVals, mode: 'lines', name: 'f(x)', line: { color: '#2563eb', width: 3 } };
            const traceDF = { x: xVals, y: dyVals, mode: 'lines', name: "f'(x) [Slope]", line: { color: '#16a34a', dash: 'dash' } };
            const traceDDF = { x: xVals, y: ddyVals, mode: 'lines', name: "f''(x) [Concavity]", line: { color: '#dc2626', dash: 'dot' } };
            const traceCrit = { x: critX, y: critY, mode: 'markers', name: 'Critical Points', marker: { color: '#9333ea', size: 10 } };

            const layout = {
                title: `Curve Analysis of f(x) = ${exprStr}`,
                xaxis: { title: 'x', zeroline: true },
                yaxis: { title: 'y', zeroline: true, range: [-15, 15] },
                hovermode: 'closest'
            };

            Plotly.newPlot('plot', [traceF, traceDF, traceDDF, traceCrit], layout);
        } catch (err) {
            alert("Invalid function syntax. Try something like: x^3 - 3*x or sin(x)");
        }
    }

    window.onload = analyzeAndPlot;
</script>
</body>
</html>
